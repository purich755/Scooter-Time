<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gauge lab</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alumni+Sans:wght@600;700;800&family=Caveat:wght@500;700&family=Cormorant+Garamond:ital,wght@0,500;1,500&family=Manrope:wght@400;600&display=swap">
  <link rel="stylesheet" href="../css/styles.css">
  <style>
    body { padding: 40px; }
    .row { display: flex; flex-wrap: wrap; gap: 40px; align-items: center; }
    .a { width: 460px; } .b { width: 420px; } .c { width: 168px; } .d { width: 28px; } .e { width: 150px; }
    .btns { margin-top: 20px; display: flex; gap: 10px; flex-wrap: wrap; }
    .btns button { border: 1px solid #555; padding: 8px 14px; border-radius: 4px; }
  </style>
</head>
<body>
  <div class="row">
    <div class="a" id="clock"></div>
    <div class="b" id="tf"></div>
    <div class="c" id="pre"></div>
    <div class="d" id="mini"></div>
    <div class="e" id="fin"></div>
    <button class="ign" id="key" type="button" aria-pressed="false"></button>
    <button class="car-key" id="key2" type="button" aria-pressed="false"></button>
  </div>
  <div class="btns">
    <button id="sweep">sweep</button><button id="next">tariff+</button><button id="spin">spin</button><button id="k">key</button>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
  <script src="../js/config.js"></script>
  <script src="../js/gauge.js"></script>
  <script>
    const { Gauge, Ignition } = ST;
    const hours = []; for (let h = 0; h < 24; h += 2) hours.push({ f: h / 24, t: String(h).padStart(2, '0') });
    const clock = new Gauge(document.getElementById('clock'), { arc: [0, 360], ticks: 96, major: 4, labels: hours, labelR: 126, labelSize: 25, zones: [{ f0: 10 / 24, f1: 1 }], hands: ['hour', 'minute', 'second'], odometer: 18, odoTop: .615, captions: [{ t: 'ВРЕМЯ КАЗАНИ', y: 142, size: 13 }] });
    const pos = [.1, .3, .5, .7, .9];
    const tf = new Gauge(document.getElementById('tf'), { arc: [-120, 120], ticks: 50, major: 5, labels: ['1 Ч', '2 Ч', '3 Ч', '4 Ч', 'НОЧЬ'].map((t, i) => ({ f: pos[i], t })), labelR: 122, labelSize: 27, zones: [{ f0: .8, f1: 1 }], odometer: 17, odoTop: .66, captions: [{ t: 'ВРЕМЯ АРЕНДЫ', y: 150 }] });
    const pre = new Gauge(document.getElementById('pre'), { arc: [-120, 120], ticks: 40, major: 5, labels: [0,1,2,3,4,5,6,7,8].map((n) => ({ f: n / 8, t: String(n) })), labelR: 124, labelSize: 34, zones: [{ f0: .78, f1: 1 }], odometer: 5, odoTop: .6, captions: [{ t: '×1000', y: 300, size: 18 }] });
    const mini = new Gauge(document.getElementById('mini'), { arc: [0, 360], mini: true });
    const fin = new Gauge(document.getElementById('fin'), { arc: [-120, 120], ticks: 30, major: 5, labels: [0, 20, 40, 60].map((n, i) => ({ f: i / 3, t: String(n) })), labelR: 122, labelSize: 34, odometer: 10, odoTop: .64 });
    let ti = 0;
    tf.setFraction(pos[0], { instant: true }); tf.setOdometer('1 000 ₽', { instant: true });
    pre.setFraction(0, { instant: true }); fin.setFraction(.7, { instant: true }); fin.setOdometer('ПОЕХАЛИ', { instant: true });
    function tick() {
      const n = ST.kazanNow();
      clock.state.hour = ((n.h + n.m / 60 + n.s / 3600) / 24) * 360;
      clock.state.minute = ((n.m + n.s / 60) / 60) * 360;
      clock.state.second = n.s * 6; clock.render();
      mini.state.main = clock.state.hour; mini.render();
    }
    tick(); setInterval(tick, 1000);
    const st = ST.status(); clock.setOdometer(st.open ? 'ОТКРЫТО · ДО 00:00' : 'ОТКРОЕМСЯ В 10:00', { instant: true });
    const prices = ['1 000 ₽', '1 700 ₽', '2 500 ₽', '3 200 ₽', 'ПО ДОГОВОРЁННОСТИ'];
    document.getElementById('next').onclick = () => { ti = (ti + 1) % 5; tf.setFraction(pos[ti]); tf.setOdometer(prices[ti]); };
    document.getElementById('sweep').onclick = () => clock.sweep();
    document.getElementById('spin').onclick = () => pre.setOdometer(ST.kazanNow().hhmm, { spin: true });
    const k = new Ignition(document.getElementById('key'), { ring: 'THE SCOOTER TIME · КАЗАНЬ ·' });
    const k2 = new Ignition(document.getElementById('key2'), {});
    document.getElementById('k').onclick = () => { k.toggle(); k2.toggle(); };
    document.getElementById('key').onclick = () => k.toggle();
  </script>
</body>
</html>
